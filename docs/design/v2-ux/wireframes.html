<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模桥 V2 线框稿</title>
<style>
/* ---------- 评审工具外壳（中性色，不属于设计稿） ---------- */
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#e9ebee;color:#222}
.tool{position:sticky;top:0;z-index:50;background:#20262c;color:#e8ecef;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tool b{font-weight:600;margin-right:4px}
.seg{display:inline-flex;border:1px solid #4a535c;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#cfd6dc;border:0;padding:5px 10px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:#e8ecef;color:#20262c;font-weight:600}
.statebar{background:#2b3239;color:#cfd6dc;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:48px;z-index:49}
.statebar .lbl{opacity:.7;margin-right:6px}
.chip{border:1px solid #56606a;background:transparent;color:#dfe5ea;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:#f0c674;color:#222;border-color:#f0c674}
.stage{display:flex;gap:18px;padding:18px;align-items:flex-start;overflow-x:auto}
.notes{flex:0 0 300px;background:#fff;border-radius:10px;padding:14px 16px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;font-size:13px;box-shadow:0 1px 3px #0001}
.notes h3{margin:0 0 6px;font-size:14px}
.notes ol{padding-left:18px;margin:6px 0}
.notes li{margin:5px 0}
.notes .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:#fff3cd;color:#6b4e00;margin-right:4px}
@media (max-width:1100px){.stage{flex-direction:column}.notes{position:static;flex:auto;width:100%;max-height:none}}

/* ---------- 设计 token（设计稿本体） ---------- */
.frame{--bg:#FAF9F5;--surface:#FFFFFF;--sunken:#F2F1EB;--text:#1B2A2F;--muted:#5B6B70;--border:#DDE3DF;--brand:#157A6E;--brand-ink:#FFFFFF;--attend:#A35A12;--ok:#2F7D32;--bad:#B3261E;--warn:#8A5A00;--info:#2B5FA8;--ai:#5A4FB0;--ln:#D9DDD8;
  --hero:#0B1D24;--mint:#91E4C8;
  background:var(--bg);color:var(--text);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #0002;position:relative;flex:0 0 auto}
.frame[data-theme=dark]{--bg:#0F171A;--surface:#152126;--sunken:#0B1215;--text:#E4ECEA;--muted:#9FB1B0;--border:#26363B;--brand:#5CC8B2;--brand-ink:#06231E;--attend:#E3A25A;--ok:#7CCB80;--bad:#F2867E;--warn:#E6B65C;--info:#8DB2F0;--ai:#A79DF0;--ln:#2A3A3F}
.frame.d{width:1180px;min-height:760px}
.frame.m{width:390px;height:800px;overflow-y:auto;border:10px solid #111;border-radius:34px}
.frame button,.frame input,.frame textarea,.frame select{font:inherit;color:inherit}
.frame a{color:var(--brand);cursor:pointer;text-decoration:none}
.frame a:hover{text-decoration:underline}
.frame :focus-visible{outline:3px solid var(--attend);outline-offset:2px}

/* 通用 */
.ln{display:block;height:9px;border-radius:5px;background:var(--ln);margin:9px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--brand)}
.btn.ghost{border-color:var(--border);background:transparent;color:var(--text);font-weight:500}
.btn.ai{border-color:var(--ai);background:transparent;color:var(--ai)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 6px;color:var(--muted);margin-right:4px;white-space:nowrap}
.badge.ai{border-color:var(--ai);color:var(--ai)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.preset{border-color:var(--brand);color:var(--brand)}
.anno{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#f0c674;color:#222;font-size:11px;font-weight:700;margin:0 4px;vertical-align:middle;flex:0 0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
hr.s{border:0;border-top:1px solid var(--border);margin:14px 0}

/* 顶栏 */
.hdr{display:flex;align-items:center;gap:18px;height:56px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.hdr.hero{background:var(--hero);color:#e6f2ef;border-color:#ffffff14}
.hdr.hero a{color:#cfe7e0}
.logo{font-weight:800;letter-spacing:.02em;cursor:pointer}
.logo i{font-style:normal;color:var(--brand)}
.hdr.hero .logo i{color:var(--mint)}
.hdr nav{display:flex;gap:18px}
.hdr nav a{color:inherit;opacity:.8}
.hdr nav a.cur{opacity:1;font-weight:700;border-bottom:2px solid currentColor;padding-bottom:2px}
.icon-btn{border:1px solid var(--border);background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer;color:inherit}
.hdr.hero .icon-btn{border-color:#ffffff30}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--attend);margin-left:3px;vertical-align:top}
.crumb{font-size:13px;color:var(--muted)}
.progress{width:120px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand)}

/* 首页 */
.hero{background:var(--hero);color:#E6F2EF;padding:46px 48px 40px;position:relative;overflow:hidden}
.hero h1{font-size:44px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.hero .sub{color:#9fc3bb;margin:0 0 26px}
.net{position:absolute;right:24px;top:6px;width:420px;height:300px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative}
.door{border:1px solid #ffffff2a;border-radius:14px;padding:20px 22px;background:#ffffff08}
.door.primary{background:var(--mint);color:#06231E;border-color:var(--mint)}
.door h2{margin:2px 0 6px;font-size:22px}
.door .k{font-size:12px;letter-spacing:.1em;opacity:.75}
.door .path{font-size:13px;opacity:.85;margin-bottom:14px}
.door .go{background:#06231E;color:var(--mint);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff40;border-radius:10px;padding:10px 12px}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff}
.search input::placeholder{color:#9fc3bb}
.fam{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fam span{font-size:12px;border:1px solid #ffffff30;border-radius:999px;padding:2px 9px;color:#cfe7e0}
.results{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px;z-index:5;box-shadow:0 8px 24px #0003}
.results .grp{font-size:11px;color:var(--muted);margin:6px 6px 2px;letter-spacing:.08em}
.results .it{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer}
.results .it:hover{background:var(--sunken)}
.results .it.off{opacity:.5;cursor:not-allowed}
.cont{display:flex;gap:20px;align-items:center;padding:16px 48px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.route{padding:30px 48px}
.route h2{margin:0 0 18px;font-size:22px}
.track{display:flex;align-items:flex-start}
.node{flex:1;position:relative;text-align:left;padding-right:10px}
.node:before{content:"";position:absolute;top:8px;left:16px;right:0;height:2px;background:var(--border)}
.node:last-child:before{display:none}
.node .c{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand);background:var(--brand);position:relative;z-index:1}
.node.off .c{background:var(--bg);border-color:var(--border)}
.node b{display:block;margin-top:8px}
.node.off{color:var(--muted)}
.links{padding:0 48px 30px;color:var(--muted)}
.foot{border-top:1px solid var(--border);padding:16px 48px;font-size:12px;color:var(--muted)}

/* 精讲 */
.retbar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:color-mix(in srgb,var(--attend) 12%,var(--surface));border-bottom:1px solid var(--attend);font-size:13px}
.retbar a{font-weight:700;color:var(--attend)}
.reader{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:32px;padding:26px 28px}
.reader.notoc{grid-template-columns:40px minmax(0,1fr) 260px}
.reader.withai{grid-template-columns:200px minmax(0,1fr) 380px}
.reader.withai.notoc{grid-template-columns:40px minmax(0,1fr) 380px}
.toc{font-size:13px}
.toc a{display:block;color:var(--muted);padding:4px 8px;border-left:2px solid transparent}
.toc a.cur{color:var(--text);font-weight:700;border-color:var(--brand);background:var(--sunken)}
.article{max-width:680px;font-size:16px;line-height:1.85}
.article h2{font-size:24px;margin:4px 0 14px}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.para{position:relative}
.para.hl{outline:2px solid var(--attend);outline-offset:6px;border-radius:4px;background:color-mix(in srgb,var(--attend) 8%,transparent)}
.formula{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:16px 0;display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:18px}
.formula .ask{margin-left:auto;font-family:inherit;font-size:12px}
.cp{border-left:3px solid var(--attend);background:var(--sunken);padding:12px 16px;margin:18px 0;border-radius:0 8px 8px 0}
.cp .k{font-size:12px;color:var(--attend);font-weight:700;letter-spacing:.08em}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--surface)}
.opt.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.fb{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:10px;background:var(--surface)}
.fb.bad{border-color:var(--bad)}
.fb.ok{border-color:var(--ok)}
.fb .t{font-weight:700}
.fb.bad .t{color:var(--bad)}
.fb.ok .t{color:var(--ok)}
.margin{font-size:13px;color:var(--muted);border-left:1px solid var(--border);padding-left:16px}
.margin dt{font-family:Georgia,serif;color:var(--text);font-weight:700;margin-top:8px}
.margin dd{margin:0}
.selpop{position:absolute;top:-38px;left:120px;background:var(--text);color:var(--bg);border-radius:8px;padding:5px 10px;font-size:12px;box-shadow:0 4px 12px #0003;cursor:pointer;white-space:nowrap}
.mtoc{display:flex;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px;background:var(--surface)}
.cover{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:26px}
.cover .row a{font-size:13px}

/* AI 抽屉 */
.drawer{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;font-size:13px;min-height:560px}
.drawer.sheet{position:sticky;bottom:64px;border:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px #0003;min-height:0;max-height:430px;overflow:auto;margin:0 -1px}
.dr-h{padding:10px 14px;border-bottom:1px solid var(--border)}
.dr-h .ctx{font-weight:700}
.dr-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.unavail{border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12px}
.levels{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.levels button{flex:1;border:0;background:transparent;padding:6px 4px;cursor:pointer}
.levels button[aria-pressed=true]{background:var(--ai);color:#fff;font-weight:700}
.levels button.lock{opacity:.4}
.consent{border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.consent label{display:flex;gap:6px;align-items:flex-start;margin:4px 0}
.consent .pv{font-size:11px;color:var(--muted);margin-left:22px}
.intents{display:flex;gap:6px;flex-wrap:wrap}
.intents span{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;cursor:pointer}
.dr-b textarea{width:100%;min-height:54px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:8px}
.msg{border-radius:8px;padding:8px 10px;background:var(--sunken)}
.msg.user{background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
pre.payload{font-size:11px;background:var(--sunken);border-radius:6px;padding:8px;white-space:pre-wrap;margin:6px 0 0;max-height:150px;overflow:auto}

/* 弹层 */
.scrim{position:absolute;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30}
.frame.m .scrim{align-items:flex-end}
.dialog{background:var(--surface);color:var(--text);border-radius:14px;padding:18px 20px;width:440px;max-width:94%;box-shadow:0 10px 40px #0005}
.frame.m .dialog{border-radius:16px 16px 0 0;width:100%;max-width:100%}
.dialog h3{margin:0 0 8px}
.dialog textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:8px}
.pick{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.pick.sel{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}

/* 刷题 */
.practice{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding:22px 28px}
.practice.withai{grid-template-columns:180px minmax(0,1fr) 360px}
.qnav a{display:flex;gap:8px;padding:6px 8px;border-radius:6px;color:var(--text)}
.qnav a.cur{background:var(--sunken);font-weight:700}
.st{width:16px;text-align:center}
.qcard{max-width:660px}
.qcard h2{font-size:19px;line-height:1.6;margin:8px 0 14px;font-weight:600}
.banner{border:1px solid var(--info);color:var(--info);border-radius:8px;padding:7px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.nudge{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;border-top:1px dashed var(--border);margin-top:10px;padding-top:8px}
.ladder{border:1px solid var(--border);border-radius:10px;margin-top:12px;overflow:hidden}
.ladder .tabs{display:flex;border-bottom:1px solid var(--border)}
.ladder .tabs button{flex:1;border:0;background:transparent;padding:8px;cursor:pointer}
.ladder .tabs button[aria-pressed=true]{background:var(--sunken);font-weight:700;box-shadow:inset 0 -2px 0 var(--brand)}
.ladder .body{padding:12px 14px}
.ladder .ai-row{border-top:1px dashed var(--border);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
.actbar{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);z-index:3}
.actbar .btn{flex:1}

/* 七关 */
.stepper{display:flex;gap:4px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);align-items:center;flex-wrap:wrap}
.stepper span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
.stepper span.done{border-color:var(--ok);color:var(--ok)}
.stepper span.cur{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.stepper span.soft{opacity:.6}
.quest{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:24px;padding:20px 24px}
.quest.withside{grid-template-columns:200px minmax(0,1fr) 380px}
.editor{border:1px solid var(--border);border-radius:8px;min-height:140px;padding:10px;background:var(--surface)}
.tools h4{margin:12px 0 6px;font-size:13px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}

/* 资料 */
.libtabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.libtabs a{padding:12px 12px;color:var(--muted)}
.libtabs a.cur{color:var(--text);font-weight:700;box-shadow:inset 0 -2px 0 var(--brand)}
.lib{display:grid;grid-template-columns:170px minmax(0,1fr) 400px;gap:22px;padding:18px 24px}
.filters a{display:block;padding:4px 8px;border-radius:6px;color:var(--text);font-size:13px}
.filters a.cur{background:var(--sunken);font-weight:700}
.pitem{border-bottom:1px solid var(--border);padding:10px 0;cursor:pointer}
.pitem.cur{box-shadow:inset 3px 0 0 var(--brand);padding-left:10px}
.detail{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface);font-size:13px}
.detail input{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);margin-top:3px}
.preview{background:var(--sunken);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12.5px;line-height:1.7;margin:10px 0}
.ph{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn);border-radius:3px;padding:0 2px}
.filled{background:color-mix(in srgb,var(--brand) 18%,transparent);border-radius:3px;padding:0 2px}
.copyres{font-size:12px;margin-top:8px;border-radius:6px;padding:6px 8px}
.copyres.ok{border:1px solid var(--ok);color:var(--ok)}
.copyres.warn{border:1px solid var(--warn);color:var(--warn)}
.copyres.bad{border:1px solid var(--bad);color:var(--bad)}

/* 记录 */
.rec{padding:22px 32px;max-width:980px}
.rec h1{font-size:24px;margin:0 0 4px}
.rec section{border-top:1px solid var(--border);padding:14px 0}
.rec h2{font-size:16px;margin:0 0 8px}
.dc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dc > div{border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch i{width:36px;height:20px;border-radius:10px;background:var(--ln);position:relative;display:inline-block}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on i{background:var(--brand)}
.switch.on i:after{left:18px}
.warnbar{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin:10px 0}
.empty{border:1px dashed var(--border);border-radius:10px;padding:18px;color:var(--muted);text-align:center}


/* ---------- 开屏 D-019（品牌层，始终深色） ---------- */
.framewrap{position:relative;flex:0 0 auto}
.splash{position:absolute;inset:0;z-index:40;background:rgba(11,29,36,var(--sp-bg,1));border-radius:10px;overflow:hidden;cursor:pointer;transition:none}
.splash[hidden]{display:none}
.framewrap.m .splash{inset:10px;border-radius:24px}
.splash canvas{position:absolute;inset:0;width:100%;height:100%}
.sp-word{position:absolute;left:50%;top:calc(50% + var(--sp-wy,70px));transform:translate(-50%,8px);opacity:0;color:#E6F2EF;text-align:center;font-size:30px;letter-spacing:.08em;white-space:nowrap}
.sp-word span{display:block;font-size:12px;letter-spacing:.32em;color:#91E4C8;margin-top:4px;text-transform:uppercase}
.sp-hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:12px;color:#9fc3bb;opacity:0;transition:opacity .3s}
.sp-load{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:12px;color:#9fc3bb;opacity:0}
.splash.fast{transition:opacity .25s ease-out;opacity:0}

/* 显示可点区域：虚线框 = 线框内可交互；未框出的按钮/链接为静态示意 */
.frame.showclick [data-act],.frame.showclick [data-go],.frame.showclick input,.frame.showclick textarea,.frame.showclick [contenteditable]{outline:2px dashed #e0a100 !important;outline-offset:1px}

/* 手机覆盖 */
.frame.m .hdr{padding:0 14px;gap:10px}
.frame.m .hero{padding:26px 18px 22px}
.frame.m .hero h1{font-size:28px}
.frame.m .net{display:none}
.frame.m .doors{grid-template-columns:1fr}
.frame.m .cont,.frame.m .route,.frame.m .links,.frame.m .foot{padding-left:18px;padding-right:18px}
.frame.m .track{flex-direction:column;gap:12px}
.frame.m .node:before{display:none}
.frame.m .node{display:flex;gap:10px;align-items:center}
.frame.m .node b{margin:0}
.frame.m .reader,.frame.m .practice,.frame.m .quest,.frame.m .lib{display:block;padding:16px}
.frame.m .toc,.frame.m .margin,.frame.m .qnav,.frame.m .filters{display:none}
.frame.m .dc{grid-template-columns:1fr}
.frame.m .rec{padding:16px}
.frame.m .detail{margin-top:14px}

<script>
/* ======================= 状态 ======================= */
const PAGES=[["home","首页"],["lesson","模型精讲"],["practice","专项刷题"],["quest","七关实战"],["library","资料·提示词库"],["records","学习记录"]];
const S={
  page:"home",device:"d",theme:"light",
  home:{returning:true,q:""},
  lesson:{toc:true,ai:false,sel:false,cp:null,cpSel:null,hl:false},
  ticket:null,               // 回程票
  practice:{answer:null,attempts:0,result:null,help:0,restored:false,nudgeOff:false,unknown:false,sawSolution:false},
  ai:{open:false,level:"nudge",draft:false,sel:false,summary:null,sent:false,picker:false,pickSel:null,summaryText:"",persist:"session",threadsByScope:{}},
  quest:{side:null,stageView:2},
  menu:false,search:false,showClick:false,
  library:{tab:"prompts",filter:"全部",open:"pr.breakdown.base",vars:{contest:"",problem:"",idea:""},copy:null,fromQuest:false},
  records:{empty:false,storageOff:false,dialog:null},
};
const EX={id:"practice-4",title:"练习 2",kp:"资源约束的写法",anchor:"§2 把生产计划翻译成数学",
  prompt:"装配每周最多 80 小时；A 每 m² 需装配 1 小时，B 每 m² 需 2 小时。正确的装配约束是？",
  opts:[["a","x + 2y ≥ 80"],["b","x + 2y ≤ 80"],["c","2x + y ≤ 80"],["d","x + 2y = 80"]],answer:"b",
  errors:{a:{tag:"不等号方向",msg:"「≥ 80」会允许 (0, 50)：装配要用 100 小时，超过可用的 80 小时。"},
          c:{tag:"系数对应",msg:"2x + y 是切割工时的写法。装配中 A 用 1 小时、B 用 2 小时。"},
          d:{tag:"把上限当成必须用完",msg:"「= 80」要求装配恰好用满，但题目只说「最多」，允许有剩余。"}},
  help:["「每周最多 80 小时」中的“最多”，对应哪个不等号？","试试 x=0、y=50：装配一共要用多少小时？这个计划应当被允许吗？","装配总用量 = 1·x + 2·y（小时），不能超过 80，所以写 x + 2y ≤ 80；另需 x, y ≥ 0。“恰好用完”是求解后可能出现的结果，不能预先写成等式。"]};
const PROMPT={id:"pr.breakdown.base",title:"赛题拆解 · 基础版",task:"读题拆解",contest:"通用（国赛 / 美赛可用）",
  text:"我正在参加{比赛名称}。下面是题目：\n{题目内容}\n\n请不要直接给出模型或答案。请帮我：\n1. 用一句话复述题目要解决的核心问题；\n2. 拆出 2–4 个小问，每个小问写出需要的输入和期望输出；\n3. 指出题目中我可能忽略的限制条件。\n我目前的想法是：{我已有的思路}\n（我会自行核对你的回答，并在论文中如实说明 AI 使用情况。）",
  vars:[["contest","比赛名称"],["problem","题目内容"],["idea","我已有的思路"]]};
const PROMPTS=[[PROMPT.id,PROMPT.title,"读题拆解","通用"],["pr.io.table","小问输入输出表","读题拆解","通用"],["pr.model.check","模型选择自检","方法选择","国赛 / 美赛"],["pr.debug.explain","解释报错但不改写全部代码","代码调试","通用"],["pr.abstract.review","摘要自检清单","摘要与论文","美赛"]];

/* ======================= 工具 ======================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=(ws)=>ws.map(w=>`<span class="ln" style="width:${w}%"></span>`).join("");
const A=(n)=>`<span class="anno" aria-hidden="true">${n}</span>`;
const isM=()=>S.device==="m";

/* ======================= 外壳 ======================= */
function header(kind){
  const cur={lesson:"精讲",practice:"刷题",quest:"实战",library:"资料"}[S.page];
  const nav=[["lesson","精讲"],["practice","刷题"],["quest","实战"],["library","资料"]];
  if(isM()){
    const title={home:"",lesson:"线性规划 · 4/10",practice:"刷题 · 2/6",quest:"实战 · 第 2/7 关",library:"资料中心",records:"学习记录"}[S.page];
    return `<header class="hdr ${kind==="hero"?"hero":""}"><span class="logo" data-go="home">M<i>·</i>模桥</span><span class="small muted">${title}</span><span class="sp"></span>
      ${S.page==="lesson"||S.page==="practice"||S.page==="quest"?`<button class="icon-btn" data-act="ai-open" aria-label="打开 AI 助教">✦</button>`:""}
      <button class="icon-btn" data-act="search" aria-label="搜索">⌕</button><button class="icon-btn" data-act="menu" aria-label="菜单" aria-expanded="${S.menu}">☰</button></header>`;
  }
  let mid="";
  if(S.page==="lesson") mid=`<span class="crumb">精讲 / 线性规划 / 02 把生产计划翻译成数学</span><span class="progress" title="阅读位置 2/10"><i style="width:20%"></i></span><span class="small muted">2/10</span>`;
  if(S.page==="practice") mid=`<span class="crumb">刷题 / 线性规划 / 练习 2 of 6</span>`;
  if(S.page==="quest") mid=`<span class="crumb">实战 / 资源分配训练题</span><span class="small muted">草稿已保存 14:02</span>`;
  return `<header class="hdr ${kind==="hero"?"hero":""}">
    <span class="logo" data-go="home" title="首页">M<i>·</i>模桥</span>
    <nav aria-label="主导航">${nav.map(([p,l])=>`<a data-go="${p}" class="${cur===l?"cur":""}">${l}</a>`).join("")}</nav>
    ${mid}<span class="sp"></span>
    <button class="icon-btn" data-act="search" aria-label="搜索">⌕ <span class="small">⌘K</span></button>
    <a data-go="records" style="color:inherit">学习记录<span class="dot" title="有未提交草稿"></span></a>
    <button class="icon-btn" data-act="theme" aria-label="切换主题">◐</button>
    ${["lesson","practice","quest"].includes(S.page)?`<button class="icon-btn" data-act="ai-open" style="color:var(--ai);border-color:var(--ai)">✦ 助教</button>`:""}
  </header>`;
}

/* ======================= AI 抽屉（共享） ======================= */
function scope(){
  if(S.page==="lesson") return {type:"section",id:"variables",title:"线性规划 / §2 把生产计划翻译成数学"};
  if(S.page==="quest") return {type:"quest-stage",id:"quest:lp-case/breakdown",title:"资源分配训练题 / 第 2 关 拆解任务"};
  return {type:"exercise",id:EX.id,title:"线性规划 / 练习 2 · 约束建模"};
}
function drawer(){
  const sc=scope(), a=S.ai;
  const key=sc.type+":"+sc.id, th=a.threadsByScope[key]||[];
  const levels=[["nudge","启发"],["clue","线索"],["full","完整讲解"]];
  const items=[
    {k:"loc",label:`当前位置（公开）：${sc.title}`,on:true,fixed:true,pv:`scope=${key}`},
    S.page==="practice"?{k:"draft",label:"我的作答草稿",on:a.draft,pv:S.practice.answer?`选择了：${EX.opts.find(o=>o[0]===S.practice.answer)[1]}`:"（尚未作答）"}:null,
    S.page==="lesson"?{k:"sel",label:"选中的公式 / 段落",on:a.sel,pv:"x + 2y ≤ 80（装配约束）"}:null,
    S.page==="quest"?{k:"draft",label:"本关作答草稿",on:a.draft,pv:"小问 1：预测各产品需求… (128 字)"}:null,
    a.summary?{k:"sum",label:"带入的讨论摘要（非 AI 生成，可编辑）",on:true,pv:a.summary}:null,
  ].filter(Boolean);
  const payload={scope:key,level:a.level,context:items.filter(i=>i.on).map(i=>i.label),message:"（你在输入框中的问题）"};
  return `<aside class="drawer ${isM()?"sheet":""}" role="complementary" aria-label="AI 助教">
    <div class="dr-h">
      <div class="row"><span class="ctx">✦ AI 助教</span><span class="sp"></span>
        <button class="icon-btn small" data-act="ai-pick" title="带入其他讨论">⋯ 带入其他讨论</button>
        <button class="icon-btn" data-act="ai-close" aria-label="关闭助教">×</button></div>
      <div class="small muted" style="margin-top:4px">${A(1)}正在讨论：<b style="color:var(--text)">${esc(sc.title)}</b></div>
      <div class="small" style="margin-top:4px">${A(2)}<span class="badge ${a.persist==="device"?"ok":""}">${a.persist==="device"?"已保存到此设备":"仅本次浏览"}</span><span class="muted">换题即新会话；回到本题可恢复</span></div>
    </div>
    <div class="dr-b">
      <div class="unavail">${A(3)}AI 助教尚未接入。下方仅演示一次请求如何组成，<b>不会生成回答，也不会发出网络请求</b>。课程提示、判分与解析不受影响。</div>
      ${th.map(m=>`<div class="msg ${m.role}"><span class="badge ${m.role==="user"?"":"warn"}">${m.role==="user"?"我":"未发送 · 演示"}</span> ${esc(m.text)}</div>`).join("")}
      <div><div class="small muted" style="margin-bottom:4px">${A(4)}帮助深度（切换不会触发请求）</div>
        <div class="levels" role="group" aria-label="帮助深度">${levels.map(([k,l])=>`<button aria-pressed="${a.level===k}" data-act="lvl" data-v="${k}">${l}</button>`).join("")}</div></div>
      <div class="consent">${A(5)}<b>将发送</b> <span class="small muted">只有勾选项会随下一条消息发送</span>
        ${items.map(i=>`<label><input type="checkbox" ${i.on?"checked":""} ${i.fixed?"disabled":""} data-act="consent" data-k="${i.k}"> <span>${esc(i.label)}</span></label><div class="pv">${esc(i.pv)}</div>`).join("")}
      </div>
      <div class="intents">${["解释这一段","我卡在这一步","帮我检查思路","分析报错"].map(t=>`<span data-act="intent" data-v="${t}">${t}</span>`).join("")}</div>
      <textarea id="ai-input" aria-label="向 AI 助教提问" placeholder="写下你的问题…"></textarea>
      <div class="row"><button class="btn ai" data-act="ai-send">查看将发送的内容</button><span class="small muted">接入后此按钮为「发送给 AI」</span></div>
      ${a.sent?`<div><span class="badge warn">未发送</span><span class="small muted">以下为请求预览</span><pre class="payload">${esc(JSON.stringify(payload,null,2))}</pre></div>`:""}
    </div></aside>`;
}
function pickerDialog(){
  const a=S.ai;
  if(!a.picker) return "";
  const threads=[["lp.ch1.s04","精讲 §4 顶点比较","我为什么只需要比较四个顶点？ / 如果两条边平行会怎样？"],["ex.lp.p01","练习 1 · 目标函数","2000 和 2600 哪个是最优？"]];
  if(a.picker==="list") return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="选择要带入的讨论">
    <h3>带入其他讨论</h3><p class="small muted">只列出本次浏览中的会话${a.persist==="device"?"和已保存到此设备的会话":""}。不会自动发送。</p>
    ${threads.map(t=>`<div class="pick ${a.pickSel===t[0]?"sel":""}" data-act="pick" data-v="${t[0]}"><b>${t[1]}</b><div class="small muted">${t[2]}</div></div>`).join("")}
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn ghost" data-act="pick-cancel">取消</button><button class="btn ai" data-act="pick-next" ${a.pickSel?"":"disabled"}>预览摘要</button></div></div></div>`;
  return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="预览摘要">
    <h3>摘要预览 <span class="badge">非 AI 生成 · 摘录我的提问</span></h3>
    <p class="small muted">确认后，这段文字会出现在「将发送」清单中，并只随你下一次主动发送的消息一起发出。可以修改或删减。</p>
    <textarea id="sum-text">${esc(a.summaryText)}</textarea>
    <div class="small muted">不会带入：对方回复全文、标准答案、你的其他草稿。</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="pick-back">← 重新选择</button><span class="sp"></span><button class="btn ghost" data-act="pick-cancel">取消</button><button class="btn ai" data-act="pick-confirm">确认带入</button></div></div></div>`;
}

  const res=q?`<div class="results" role="listbox">
      <div class="grp">精讲</div><div class="it" data-go="lesson"><span>线性规划 · 有限资源怎样分配</span><span class="badge ok">可学</span></div>
      <div class="grp">练习</div><div class="it" data-go="practice"><span>线性规划专项 · 6 题</span><span class="badge ok">可练</span></div>

        <label class="search"><span aria-hidden="true">⌕</span><input id="home-q" value="${esc(S.home.q)}" placeholder="搜索方法、题型或赛题，例如“优化”" aria-label="搜索方法、题型或赛题"></label>
        <div class="fam"><span>优化</span><span>预测</span><span>评价</span><span>统计</span><span>赛题</span></div>

    </div>
  </section>
  ${S.home.returning?`<div class="cont">${A(4)}<b>继续学习</b>
    <span>线性规划 · 第 4 节 完整求出最优解 <span class="muted small">· 2 天前</span></span><button class="btn sec" data-go="lesson">继续阅读</button>

    <div class="track" style="margin-top:18px">
      ${[["认识建模","5 分钟导论",1],["线性规划","精讲 · 刷题 · 实战",1],["回归预测","筹备中",0],["评价决策","筹备中",0],["综合项目","筹备中",0]].map(([t,s,on])=>`<div class="node ${on?"":"off"}" ${on?"":'aria-disabled="true" title="预计内容，尚未开放"'}><div class="c"></div><b>${t}</b><span class="small muted">${s}</span></div>`).join("")}

  const toc=["一周的资源，应该怎样分配？","把生产计划翻译成数学","看见所有允许的计划","不用软件，完整求出最优解","让 Python 重现你的推导","再多一小时，究竟值多少钱？","必须整块生产时，答案会变吗？","算对了，还要问模型是否可信","合上推导，检查自己是否理解","把这套思路带到新的问题"];
  const cp=L.cp;
  const cpBlock=`<div class="cp">${A(5)}<div class="k">试一试 · 检查点</div>
    <div style="margin:4px 0 6px">如果 A 做 40 m²、B 做 20 m²，装配会剩下多少小时？</div>
    ${[["0","0 小时"],["20","20 小时"],["40","40 小时"]].map(([v,l])=>`<label class="opt ${L.cpSel===v?"sel":""}"><input type="radio" name="cp" data-act="cp-sel" data-v="${v}" ${L.cpSel===v?"checked":""}> ${l}</label>`).join("")}
    <div class="row" style="margin-top:6px"><button class="btn sec" data-act="cp-check">核对</button><a class="small" data-act="noop">跳过 ↓</a><span class="small muted">不计成绩</span></div>

    ${cp==="bad"?`<div class="fb bad"><div class="t">✕ 再想想</div>装配用量 = 1·x + 2·y。代入 x=40, y=20 后与 80 比较。<div class="row" style="margin-top:6px"><a data-act="cp-retry">再试一次</a><a data-act="cp-confused">我没理解</a></div>
      ${L.cpConfused?`<div class="nudge">${A(6)}<a data-act="hl">查看相关讲解（本节第 2 段）</a><button class="btn ai" data-act="ai-open">✦ 向 AI 提问</button><span class="small muted">两个都是你点了才发生</span></div>`:""}</div>`:""}
  </div>`;
  const article=`<article class="article">
    ${!t?`<div class="cover">${A(2)}<div class="kicker">专题封面 · 线性规划</div><b>有限资源，怎样分配才更好？</b><div class="small muted">约 45–60 分钟 · 零基础可读 · 先修：一次方程（可跳过）</div>

    <div class="kicker">02 / 先说清变量、单位和假设，再写式子</div><h2>把生产计划翻译成数学</h2>
    <p>${lines([96,90,72]).replace(/<span/g,'<span').slice(0)}</p>
    <div class="para ${L.hl||t?"hl":""}" id="p-constraint">${A(3)}
      ${L.sel?`<span class="selpop" data-act="ai-open-sel">✦ 解释所选</span>`:""}

  </article>`;

  const right=isM()?"":(S.ai.open?drawer():`<aside class="margin">${A(7)}<div class="kicker">符号表</div><dl><dt>x</dt><dd>A 产量，m²</dd><dt>y</dt><dd>B 产量，m²</dd><dt>z</dt><dd>贡献利润，元</dd></dl><hr class="s"><div class="kicker">本节关联</div><a class="small">· 线性的含义</a><br><a class="small">· 非负约束</a></aside>`);

    `<div class="reader ${L.toc?"":"notoc"} ${S.ai.open&&!isM()?"withai":""}">${tocCol}${article}${right}</div>`+(isM()&&S.ai.open?drawer():"");
}

function practice(){
  const P=S.practice;
  const navItems=[["✓","自测 1"],["◐","练习 2",1],["○","练习 3"],["✕","自测 3"],["○","练习 1"],["✓","自测 2"]];
  const qnav=`<nav class="qnav" aria-label="题目导航">${A(1)}<div class="kicker">线性规划 · 6 题</div>${navItems.map(([s,l,c])=>`<a class="${c?"cur":""}"><span class="st" aria-hidden="true">${s}</span>${l}${c&&P.answer&&!P.result?' <span class="small muted">草稿</span>':""}</a>`).join("")}
    <hr class="s"><div class="small"><a>全部</a> | <a>只看错题</a></div><div class="small muted">难度：全部 ▾</div>
    <p class="small muted">✓ 正确 ◐ 有草稿 ✕ 待重练 ○ 未做</p></nav>`;
  let fb="";
  const r=P.result;
  if(r==="invalid") fb=`<div class="fb" role="status"><div class="t">请先选择一个答案</div></div>`;
  if(r==="ok") fb=`<div class="fb ok" role="status"><div class="t">✓ 回答正确${P.sawSolution?' <span class="badge">看过解析后答对</span>':""}</div>${esc(EX.help[2])}<div class="row" style="margin-top:8px"><span class="small muted">用到的知识点：资源约束 · 不等号含义</span><span class="sp"></span><a>下一题 →</a></div></div>`;
  if(r==="bad"){
    const e=P.unknown?null:EX.errors[P.answer];
    fb=`<div class="fb bad" role="status">${A(4)}<div class="t">✕ 还不对${e?` · 错误类型：${e.tag}`:""}</div>
      ${e?esc(e.msg):"答案与参考不一致。我们无法确定具体原因——可以打开帮助，或回看相关知识点。"}
      <div class="row" style="margin-top:8px"><button class="btn sec" data-act="retry">再试一次</button><a data-act="goto-kp">${A(5)}回看：${EX.kp} ${EX.anchor} →</a><span class="small muted">不会显示标准答案</span></div>
      ${P.attempts>=2&&!P.nudgeOff?`<div class="nudge">${A(6)}<span>卡住了？可以回看知识点，或打开帮助。</span><a data-act="goto-kp">回看知识点</a><a data-act="help" data-v="1">打开帮助</a><a class="muted" data-act="nudge-off">不再提示</a></div>`:""}
    </div>`;
  }
  const lad=P.help?`<div class="ladder">${A(7)}<div class="tabs" role="tablist">${["1 启发","2 线索","3 完整解析"].map((l,i)=>`<button role="tab" aria-pressed="${P.help===i+1}" data-act="help" data-v="${i+1}">${l}${i===2&&P.attempts>=2?' <span class="badge preset">推荐</span>':""}</button>`).join("")}</div>
      <div class="body"><span class="badge preset">课程预置 · 已核验</span><div style="margin-top:6px">${esc(EX.help[P.help-1])}</div>
      ${P.help===3?`<div class="small" style="margin-top:6px"><a data-act="goto-kp">相关段落：${EX.kp} ${EX.anchor} →</a></div>`:""}</div>
      <div class="ai-row">还没懂？<button class="btn ai" data-act="ai-open-level">✦ 请 AI 助教在「${["启发","线索","完整讲解"][P.help-1]}」级别帮我</button><span class="muted">只预填，不会自动发送</span></div></div>`:"";
  const q=`<div class="qcard">
    ${P.restored?`<div class="banner" role="status">${A(2)}已恢复你的作答（尝试 ${P.attempts} 次 · 提示到第 ${P.help||0} 级）<span class="sp"></span><a data-act="clear">清空重做</a></div>`:""}
    <div class="kicker">基础 · 约束建模 · 单选 · ${EX.id} <span class="badge warn">拟新增题 · 上线前需核验</span></div>
    <h2>${esc(EX.prompt)}</h2>
    <fieldset style="border:0;padding:0;margin:0"><legend class="small muted">选择一项（自动保存草稿）</legend>
    ${EX.opts.map(([v,l])=>`<label class="opt ${P.answer===v?"sel":""}"><input type="radio" name="ex" data-act="ans" data-v="${v}" ${P.answer===v?"checked":""}> ${l}</label>`).join("")}</fieldset>
    ${isM()?"":`<div class="row" style="margin-top:12px">${A(3)}<button class="btn" data-act="submit">提交答案</button><button class="btn ghost" data-act="help" data-v="${P.help?0:1}">帮助 ${P.help?"▴":"▾"}</button><span class="small muted">尝试 ${P.attempts} 次</span></div>`}
    ${fb}${lad}
    <div class="row small" style="margin-top:16px"><a>← 上一题</a><span class="sp"></span><a>下一题 →</a></div>
    <p class="small muted">题目来源：模桥原创 · 已核验（确定性判分，不使用 AI）</p></div>`;
  const body=isM()?`<div class="mtoc"><span>练习 2/6 ▾</span><span class="muted">只看错题</span></div><div class="practice">${q}</div>`
    :`<div class="practice ${S.ai.open?"withai":""}">${qnav}${q}${S.ai.open?drawer():""}</div>`;
  const bar=isM()?`${S.ai.open?drawer():""}<div class="actbar">${A(3)}<button class="btn ghost" data-act="help" data-v="${P.help?0:1}">帮助</button><button class="btn" data-act="submit">提交答案</button></div>`:"";
  return header()+body+bar;
}

function promptDetail(compact){
  const L=S.library, v=L.vars;
  const fill={"比赛名称":v.contest,"题目内容":v.problem,"我已有的思路":v.idea};
  const prev=esc(PROMPT.text).replace(/\{(.+?)\}/g,(m,k)=>fill[k]?`<span class="filled">${esc(fill[k])}</span>`:`<span class="ph">{${k}}</span>`);
  const res=L.copy==="ok"?`<div class="copyres ok" role="status">✓ 已复制完整提示词</div>`:L.copy==="warn"?`<div class="copyres warn" role="status">已复制。仍有 ${PROMPT.vars.filter(([k])=>!v[k].trim()).length} 个占位符未填写：${PROMPT.vars.filter(([k])=>!v[k].trim()).map(x=>"{"+x[1]+"}").join("、")}</div>`:L.copy==="bad"?`<div class="copyres bad" role="status">复制失败（浏览器拒绝访问剪贴板）。已在下方展开全文并全选，请按 Ctrl+C。<textarea style="width:100%;min-height:60px;margin-top:6px" readonly>${esc(PROMPT.text)}</textarea></div>`:"";
  return `<div class="detail">
    <div class="row"><b style="font-size:15px">${PROMPT.title}</b><span class="badge">演示模板</span><span class="badge">原创</span>${compact?`<span class="sp"></span><button class="icon-btn" data-act="side-close" aria-label="关闭">×</button>`:""}</div>
    <div class="small muted" style="margin:4px 0 8px">用途：${PROMPT.task} · 适用阶段：第 1–2 关 · 比赛：${PROMPT.contest}<br>来源：模桥原创 · v0.1 · 2026-10 · 授权：原创（待定许可）</div>
    <div class="small" style="border-left:3px solid var(--warn);padding-left:8px;margin-bottom:8px">比赛提醒：是否允许使用 AI、如何披露，以当届官方规则为准。本模板不用于捏造数据、结果或引用。</div>
    ${PROMPT.vars.map(([k,l])=>`<label class="small">{${l}}${S.page==="quest"&&k!=="idea"&&L.fromQuest?' <span class="badge">已从当前训练题预填，可修改</span>':""}<input data-var="${k}" value="${esc(v[k])}"></label>`).join("")}
    <div class="preview" aria-label="提示词预览">${prev}</div>
    <div class="row"><button class="btn" data-act="copy">复制完整提示词</button><button class="btn ghost small" data-act="copy-fail">模拟：复制失败</button>${compact?`<a class="small" data-go="library">在资料中心打开 ↗</a>`:""}</div>${res}
    <p class="small muted">复制只把文字放进你的剪贴板，不会调用任何 AI。</p></div>`;
}
function quest(){
  const Q=S.quest;

  const stageTitles=["读题破冰","拆解任务","数据清单","模型选择","代码实践","图表表达","论文框架"];
  const sv=Q.stageView, preview=sv>2;
  const side=Q.side==="prompt"?promptDetail(true):Q.side==="ai"?drawer():null;
  const tools=`<aside class="tools">${A(4)}<div class="kicker">本关工具</div>
    <h4>常见错误（3）▾</h4>
    <h4>相关提示词</h4>
    <div class="prow"><span>赛题拆解 · 基础版</span><button class="btn ghost small" data-act="side-prompt">预览</button></div>
    <div class="prow"><span>小问输入输出表</span><button class="btn ghost small" data-act="side-prompt">预览</button></div>
    <hr class="s">${A(5)}<button class="btn ai" data-act="side-ai" style="width:100%">✦ 问 AI 助教</button>
    <div class="small muted" style="margin-top:4px">会发送：本关任务（公开）；你的作答需勾选后才发送</div>
    <hr class="s"><a class="small">回看方法：线性规划 §2 →</a></aside>`;
  const main=preview?`<main><div class="banner" role="status">${A(2)}预览第 ${sv} 关：可以阅读任务、通关条件并先写草稿；<b>确认完成需先完成第 2 关</b>。<span class="sp"></span><a data-act="stage" data-v="2">回到当前关卡</a></div>
    <div class="kicker">第 ${sv} 关 · ${stageTitles[sv-1]} · 预览</div><h2 style="margin:4px 0">${stageTitles[sv-1]}</h2>${lines([90,70])}
    <div class="editor" contenteditable="true" aria-label="本关草稿">（可先写草稿，自动保存）</div>

    <div class="row" style="margin-top:10px"><button class="btn" disabled aria-describedby="why">确认完成本关</button><span id="why" class="small muted">需先完成第 2 关「拆解任务」</span></div></main>`
   :`<main><div class="kicker">第 2 关 · 拆解任务 · 产出：任务拆解表</div><h2 style="margin:4px 0">把大问题拆成 2–4 个小任务</h2>
    <p class="small muted">目标：每个小任务写清输入、输出与判断指标。</p>
    <div class="editor" contenteditable="true" aria-label="本关作答">小问 1：预测各产品需求… <span class="muted">（自动保存）</span></div>
    <div style="margin-top:12px">${A(3)}<b class="small">通关条件（自检）</b>
      <label class="opt"><input type="checkbox" checked> 至少拆出 2 个小任务</label>
      <label class="opt"><input type="checkbox"> 每个小任务有输入和输出</label>
      <label class="opt"><input type="checkbox"> 能说明任务之间的先后关系</label></div>
    <div class="row" style="margin-top:10px"><button class="btn" disabled>确认完成本关 →</button><span class="small muted">还差 2 个条件</span></div></main>`;
  const problem=`<aside><div class="kicker">题面 ▾</div>${lines([95,90,85,70,92,60])}<p class="small muted">资源分配训练题 · 教学改编</p><hr class="s"><a class="small muted">AI 工作台（实验，需要后端）</a></aside>`;
  const stepper=`<div class="stepper" role="tablist" aria-label="七关">${A(1)}${stages.map((s,i)=>`<span role="tab" tabindex="0" style="cursor:pointer" aria-selected="${sv===i+1}" data-act="stage" data-v="${i+1}" class="${i===0?"done":sv===i+1?"cur":"soft"}">${i===0?"✓":i+1} ${s}${i>1?" · 预览":""}</span>`).join("")}<span class="sp"></span><span style="border:0" class="small muted">已定 Q4：可预览后续关卡，按顺序确认完成</span></div>`;
  if(isM()) return header()+`<div class="stepper"><b data-act="stage" data-v="${sv===2?3:2}" style="cursor:pointer">第 ${sv}/7 关 ${stageTitles[sv-1]}${preview?"（预览）":""} ▾</b></div><div class="libtabs"><a>任务</a><a class="cur">作答</a><a>工具</a></div><div class="quest">${main}<hr class="s">${tools}</div>${side?(Q.side==="prompt"?`<div class="scrim"><div class="dialog" style="max-height:90%;overflow:auto">${side}</div></div>`:side):""}`;
  return header()+stepper+`<div class="quest ${side?"withside":""}">${problem}${main}${side||tools}</div>`;
}

/* ======================= 首页数学网络（复用旧版 MathNetwork 算法） ======================= */
// 与 frontend/src/components/motion/MathNetwork.tsx 相同：斐波那契球面节点、绕 Y 轴旋转、0.65 距离连线、30fps、DPR≤1.5
function sphereNodes(n){return Array.from({length:n},(_,i)=>{const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),a=i*Math.PI*(3-Math.sqrt(5));return{x:Math.cos(a)*r,y,z:Math.sin(a)*r};});}
function projectNodes(nodes,phase,cx,cy,radius){return nodes.map(n=>{const x=n.x*Math.cos(phase)+n.z*Math.sin(phase),z=n.z*Math.cos(phase)-n.x*Math.sin(phase);return{x:cx+x*radius,y:cy+n.y*radius*.94+z*radius*.17,z};});}
function linkPairs(nodes){const p=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y,nodes[i].z-nodes[j].z);if(d<=.65)p.push([i,j,d]);}return p;}
const HN={phase:0,raf:0,last:0,nodes:sphereNodes(88),pairs:null,cv:null};
HN.pairs=linkPairs(HN.nodes);
function heroGeom(){const cv=HN.cv;if(!cv)return null;const w=cv.clientWidth,h=cv.clientHeight;if(!w)return null;return{w,h,cx:w/2,cy:h/2,r:Math.min(w*.36,h*.37)};}
function heroPointsIn(wrap){ // 当前首页球面各节点在 framewrap 坐标系中的位置
  const g=heroGeom();if(!g)return null;
  const a=HN.cv.getBoundingClientRect(),b=wrap.getBoundingClientRect();
  return projectNodes(HN.nodes,HN.phase,g.cx,g.cy,g.r).map(p=>({x:p.x+a.left-b.left,y:p.y+a.top-b.top,z:p.z}));}
function drawHero(){const cv=HN.cv,g=heroGeom();if(!g)return;const dpr=Math.min(devicePixelRatio||1,1.5);
  if(cv.width!==Math.round(g.w*dpr)){cv.width=Math.round(g.w*dpr);cv.height=Math.round(g.h*dpr);}
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,g.w,g.h);
  const pts=projectNodes(HN.nodes,HN.phase,g.cx,g.cy,g.r);
  c.strokeStyle="rgba(105,192,186,0.12)";[.5,.78,1.08].forEach(sc=>{c.beginPath();c.ellipse(g.cx,g.cy,g.r*1.25,g.r*sc*.4,-.38,0,Math.PI*2);c.stroke();});
  for(const[i,j,d]of HN.pairs){const p=pts[i],q=pts[j];c.strokeStyle=`rgba(100,211,196,${(.12+(p.z+q.z+2)*.045)*(1-d/.85)})`;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();}
